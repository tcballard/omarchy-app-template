name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: ./tests/run
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y qt6-base-dev pkg-config g++
      - run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy
      - run: cargo fmt --check
      - run: cargo test --locked --no-default-features
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release
      - name: Offscreen Qt startup smoke test
        run: timeout 15s target/release/$(node -p "require('./.template/project.json').slug") --smoke-test
        env:
          QT_QPA_PLATFORM: offscreen
